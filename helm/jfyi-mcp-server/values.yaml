# Default values for jfyi-mcp-server

replicaCount: 1

image:
  repository: ghcr.io/hlan-net/jfyi-just-for-your-information
  pullPolicy: IfNotPresent
  tag: ""  # Defaults to .Chart.AppVersion when empty

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

service:
  type: ClusterIP
  mcpPort: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: jfyi.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: jfyi-tls
  #   hosts:
  #     - jfyi.local

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: ~

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 2Gi
  mountPath: /data
  annotations: {}

env:
  JFYI_DATA_DIR: /data
  JFYI_DB_PATH: /data/jfyi.db
  JFYI_MCP_PORT: "8080"
  PYTHONDONTWRITEBYTECODE: "1"
  # JFYI_DLP_ENABLED: "true"   # Set to "false" to bypass PII redaction in local dev
  # JFYI_INFERENCE_ENABLED: "true"   # Enable background LLM inference of profile notes from friction events
  # JFYI_ENABLE_CLUSTERING: "true"   # Enable on-demand K-Means friction event clustering (requires cluster extra)

# JWT / session secret — stable across pod restarts and upgrades.
# If existingSecret is set, the chart reads JFYI_JWT_SECRET from that Secret.
# Otherwise a Secret named <fullname>-jwt is created automatically; the value
# is generated once and preserved across Helm upgrades via the lookup function.
jwtSecret:
  # Name of a pre-existing Secret that contains the key JFYI_JWT_SECRET.
  # Leave empty to let the chart manage the Secret for you.
  existingSecret: ""
  # Optional: set an explicit secret value. If empty, a random 64-char value
  # is generated on first install and preserved across upgrades.
  value: ""

# Inference endpoint for the server-side LLM features (background summarizer,
# inference engine, friction-cluster summaries, Vibe Profile narrative,
# warm_agent) and the dashboard's "Server-managed" rule-synthesis provider.
# Inside the container JFYI resolves, in order:
#   1. JFYI_ANTHROPIC_API_KEY                  (inference.direct.anthropicApiKey)
#   2. OPENAI_BASE_URL + OPENAI_API_KEY        (inference.aisa or inference.direct.openai*)
#   3. local Ollama fallback — only for engines you explicitly enabled
# See docs/aisa-integration.md. Enabling the engines themselves is still done
# via env (JFYI_SUMMARIZER_ENABLED / JFYI_INFERENCE_ENABLED / JFYI_ENABLE_CLUSTERING).
inference:
  # Model to request from an OpenAI-compatible endpoint (JFYI_LLM_MODEL). Leave
  # empty and JFYI picks the first id advertised by GET /v1/models.
  model: ""
  # In-cluster AISA: bind the Secret that aisa's reconciler writes into this
  # namespace (keys OPENAI_BASE_URL + OPENAI_API_KEY). The reference is optional
  # so the pod starts even before AISA has minted the key. Declare the consumer
  # in AISA with namespace=<this namespace> and secret=<secretName>.
  aisa:
    enabled: false
    secretName: ""  # Defaults to <fullname>-aisa-key
  # Direct provider credentials — no AISA. Either set values here (rendered
  # into a chart-managed Secret) or point existingSecret at one that carries
  # JFYI_ANTHROPIC_API_KEY and/or OPENAI_API_KEY (+ OPENAI_BASE_URL).
  direct:
    enabled: false
    existingSecret: ""
    anthropicApiKey: ""
    openaiApiKey: ""
    openaiBaseUrl: ""  # e.g. https://api.openai.com/v1 or http://ollama.ollama.svc:11434/v1

# List of envFrom sources (configMapRef or secretRef) injected into the container.
# Example: [{ secretRef: { name: jfyi-jwt } }]
extraEnvFrom: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /api/system/status
    port: mcp
  initialDelaySeconds: 15
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/system/status
    port: mcp
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

# ChromaDB sibling pod for semantic search. Disabled by default — when enabled,
# the chart deploys an upstream chromadb/chroma container with its own PVC and
# wires JFYI_ENABLE_VECTOR_DB=true plus JFYI_CHROMADB_HOST/PORT into the main
# jfyi container. Embeddings are computed server-side using ChromaDB's default
# ONNX-based all-MiniLM-L6-v2 EF (no torch in the JFYI image).
chromadb:
  enabled: false
  image:
    repository: chromadb/chroma
    tag: "1.5.8"
    pullPolicy: IfNotPresent
  # The upstream chromadb/chroma image runs its log writer against
  # /chroma/chroma.log inside the image filesystem (not the PVC), so it must
  # run as root. Override per-deployment if you fork to a non-root variant.
  podSecurityContext: {}
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 5Gi
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  extraEnv: {}
