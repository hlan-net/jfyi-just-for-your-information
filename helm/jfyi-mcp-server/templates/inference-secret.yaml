{{- /*
Direct inference credentials (no AISA). Only rendered when the operator put the
values in the chart; with existingSecret the operator manages the Secret.
AISA-managed credentials are never rendered here — aisa writes that Secret itself.
*/ -}}
{{- if and .Values.inference.direct.enabled (not .Values.inference.direct.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jfyi-mcp-server.inferenceSecretName" . }}
  labels:
    {{- include "jfyi-mcp-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.inference.direct.anthropicApiKey }}
  JFYI_ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.inference.direct.openaiApiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.inference.direct.openaiBaseUrl }}
  OPENAI_BASE_URL: {{ . | quote }}
  {{- end }}
{{- end }}
